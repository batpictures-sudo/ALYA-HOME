<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x202328);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.05,200); camera.position.set(0,1.45,4);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; renderer.shadowMap.enabled=true; document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.target.set(0,1.25,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x30343a,2.2));
const key=new THREE.DirectionalLight(0xffffff,3); key.position.set(3,5,4); key.castShadow=true; scene.add(key);
const floor=new THREE.Mesh(new THREE.CircleGeometry(4,64),new THREE.MeshStandardMaterial({color:0x777777,roughness:.9})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const status=document.querySelector('#status');
new GLTFLoader().load('./assets/Camila_NEW_BASE.glb',g=>{
 const m=g.scene; scene.add(m); m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 const b=new THREE.Box3().setFromObject(m), s=b.getSize(new THREE.Vector3()), c=b.getCenter(new THREE.Vector3());
 m.position.x-=c.x; m.position.z-=c.z; m.position.y-=b.min.y;
 controls.target.set(0,Math.max(.8,s.y*.58),0);
 camera.position.set(0,Math.max(1.2,s.y*.58),Math.max(2.5,s.y*1.55)); controls.update();
 status.textContent='ALYA HOME • Camila betöltve';
},undefined,e=>{status.textContent='ALYA HOME • az alap működik • Camila fájl következik'; console.error(e)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)} loop();
if('serviceWorker'in navigator) navigator.serviceWorker.register('./sw.js');
</script><!-- Pages enabled 2026-09-21 -->
